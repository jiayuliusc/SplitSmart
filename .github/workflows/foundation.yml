name: Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build credential-free local app; test shared Java contracts; lint
        run: ./gradlew :app:assembleLocalDebug :app:assembleLocalDebugAndroidTest :app:testLocalDebugUnitTest :app:lintLocalDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: app/build/reports/lint-results-localDebug.*

  firebase:
    name: Firebase emulators
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check TypeScript contracts against shared JSON fixtures
        run: npm run check:contracts
      - name: Build TypeScript and verify emulator connectivity and diagnostic rules
        run: npm run check:emulators
